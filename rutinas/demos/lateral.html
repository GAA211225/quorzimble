<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo 3D — Elevaciones laterales</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d0e12;color:#e8e9ec;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;}
.wrap{width:100%;max-width:460px;}
.hd{text-align:center;margin-bottom:10px;}
.hd h1{font-size:20px;font-weight:800;}
.tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#34D399;background:rgba(52,211,153,.12);padding:3px 10px;border-radius:12px;}
.stage{position:relative;width:100%;height:400px;background:radial-gradient(ellipse at 50% 40%,#20242c,#111318 72%);border:1px solid #2c2f38;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab;}
.stage:active{cursor:grabbing;}
.stage canvas{display:block;width:100%;height:100%;}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:#8b93a3;pointer-events:none;}
.foot{margin-top:12px;background:#1a1c22;border:1px solid #2c2f38;border-left:4px solid #F43F5E;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:#c7cbd4;}
.foot b{color:#f3f4f6;}
.err{padding:24px;text-align:center;color:#FB923C;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1 id="ex-name">Elevaciones laterales con mancuernas</h1>
    <div class="tag" id="ex-tag">Aislamiento · deltoides medio</div>
  </div>
  <div class="stage" id="stage"><div class="hint">🖐️ arrastra para girar</div></div>
  <div class="foot" id="ex-cue"></div>
</div>

<script src="../three.min.js"></script>
<script>
const EJ={
 nombre:'Elevaciones laterales con mancuernas',
 tag:'Aislamiento · deltoides medio',
 cue:'<b>De pie</b>, pies al ancho de los hombros y una mancuerna en cada mano a los costados con los <b>codos ligeramente flexionados</b>. Sube los brazos <b>abriéndolos hacia los lados hasta la altura de los hombros</b> (línea horizontal), pausa arriba y baja controlado. No uses impulso. Gíralo con el dedo para verlo desde cualquier ángulo.'
};
document.getElementById('ex-name').textContent=EJ.nombre;
document.getElementById('ex-tag').textContent=EJ.tag;
document.getElementById('ex-cue').innerHTML=EJ.cue;

const stage=document.getElementById('stage');
function boot(){
 if(!window.THREE){stage.innerHTML='<div class="err">No se pudo cargar el visor 3D. Ábrelo una vez con internet.</div>';return;}
 const w=stage.clientWidth,h=stage.clientHeight;
 const scene=new THREE.Scene();
 const cam=new THREE.PerspectiveCamera(42,w/h,0.1,50);
 cam.position.set(2.6,1.5,3.0);cam.lookAt(0,1.05,0);
 const rend=new THREE.WebGLRenderer({antialias:true,alpha:true});
 rend.setPixelRatio(Math.min(devicePixelRatio||1,2));rend.setSize(w,h);
 stage.appendChild(rend.domElement);
 scene.add(new THREE.HemisphereLight(0xbcd2ff,0x20242c,1.0));
 const dir=new THREE.DirectionalLight(0xffffff,0.9);dir.position.set(3,5,2);scene.add(dir);
 // piso
 const piso=new THREE.Mesh(new THREE.CircleGeometry(2,48),new THREE.MeshStandardMaterial({color:0x14171d,roughness:1}));
 piso.rotation.x=-Math.PI/2;scene.add(piso);

 const skin=0x6ea8ff,skin2=0x4f86e6,dark=0x2f3a4d;
 function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:.15});}
 function box(par,w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x||0,y||0,z||0);par.add(m);return m;}
 function piv(par,x,y,z){const g=new THREE.Group();g.position.set(x,y,z);par.add(g);return g;}
 function limbUp(par,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.y=h/2;par.add(m);return m;} // apunta +Y

 const orbit=new THREE.Group();scene.add(orbit);

 // ===== Cuerpo de pie =====
 const body=new THREE.Group();orbit.add(body);
 box(body,0.42,0.34,0.22,skin,0,1.20,0);                 // torso
 box(body,0.11,0.09,0.11,skin2,0,1.42,0);                // cuello
 const head=new THREE.Mesh(new THREE.SphereGeometry(0.15,18,14),mat(skin));head.position.set(0,1.56,0);body.add(head);
 box(body,0.36,0.20,0.22,skin2,0,0.99,0);                // pelvis

 // Piernas de pie: knee y=0.90-0.42=0.48 ; ankle y=0.48-0.46=0.02 ; pie plano a y=0.035
 [-0.12,0.12].forEach(function(sx){
  const hip=piv(body,sx,0.90,0);
  hip.rotation.x=Math.PI;                                 // muslo recto abajo
  limbUp(hip,0.15,0.42,0.15,skin2);
  const knee=piv(hip,0,0.42,0);
  knee.rotation.x=0;                                       // pierna recta
  limbUp(knee,0.13,0.46,0.13,skin);
  box(body,0.16,0.07,0.30,dark,sx,0.035,0.08);            // pie plano en el suelo
 });

 // Brazos: la abduccion se hace con rotation.z del hombro (abre +Y hacia mp X).
 // Dumbbell colgado del extremo del antebrazo (se mueve solo con el brazo).
 const shL=piv(body,-0.23,1.34,0);
 limbUp(shL,0.10,0.28,0.10,skin2);
 const elL=piv(shL,0,0.28,0);elL.rotation.x=-0.30;         // ligera flexion de codo
 limbUp(elL,0.09,0.26,0.09,skin);
 box(elL,0.10,0.10,0.10,dark,0,0.26,0);                    // mano
 box(elL,0.09,0.20,0.09,0x20252e,0,0.30,0);                // mancuerna
 const shR=piv(body,0.23,1.34,0);
 limbUp(shR,0.10,0.28,0.10,skin2);
 const elR=piv(shR,0,0.28,0);elR.rotation.x=-0.30;
 limbUp(elR,0.09,0.26,0.09,skin);
 box(elR,0.10,0.10,0.10,dark,0,0.26,0);
 box(elR,0.09,0.20,0.09,0x20252e,0,0.30,0);

 // Poses: rotation.z del hombro = signo*(PI - raise).
 //   raise=0.12 -> brazos casi verticales a los costados (A, abajo)
 //   raise=1.40 -> brazos abiertos a ~80° (B, a la altura de los hombros)
 // Izq: z = (PI - raise) sube +Y hacia -X (afuera a la izquierda)
 // Der: z = -(PI - raise) sube +Y hacia +X (afuera a la derecha)
 const A={raise:0.12};
 const B={raise:1.40};
 function applyArms(p){
  shL.rotation.z=  (Math.PI - p.raise);
  shR.rotation.z= -(Math.PI - p.raise);
 }

 // rotacion inicial + arrastre
 orbit.rotation.y=-0.5;
 let drag=false,px=0,py=0;
 stage.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;stage.setPointerCapture(e.pointerId);});
 stage.addEventListener('pointermove',function(e){if(!drag)return;orbit.rotation.y+=(e.clientX-px)*0.01;orbit.rotation.x=Math.max(-1.0,Math.min(1.0,orbit.rotation.x+(e.clientY-py)*0.008));px=e.clientX;py=e.clientY;});
 stage.addEventListener('pointerup',function(){drag=false;});
 stage.addEventListener('pointercancel',function(){drag=false;});
 addEventListener('resize',function(){const w=stage.clientWidth,h=stage.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();rend.setSize(w,h);});

 const t0=performance.now();
 (function loop(){
  requestAnimationFrame(loop);
  const t=(Math.sin((performance.now()-t0)/700)+1)/2; // 0..1
  const cur={};for(const k in A)cur[k]=A[k]+(B[k]-A[k])*t;
  applyArms(cur);
  rend.render(scene,cam);
 })();
}
boot();
</script>
</body>
</html>
