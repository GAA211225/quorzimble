<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo 3D — Remo con barra inclinado</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d0e12;color:#e8e9ec;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;}
.wrap{width:100%;max-width:460px;}
.hd{text-align:center;margin-bottom:10px;}
.hd h1{font-size:20px;font-weight:800;}
.tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#34D399;background:rgba(52,211,153,.12);padding:3px 10px;border-radius:12px;}
.stage{position:relative;width:100%;height:400px;background:radial-gradient(ellipse at 50% 40%,#20242c,#111318 72%);border:1px solid #2c2f38;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab;}
.stage:active{cursor:grabbing;}
.stage canvas{display:block;width:100%;height:100%;}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:#8b93a3;pointer-events:none;}
.foot{margin-top:12px;background:#1a1c22;border:1px solid #2c2f38;border-left:4px solid #F43F5E;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:#c7cbd4;}
.foot b{color:#f3f4f6;}
.err{padding:24px;text-align:center;color:#FB923C;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1 id="ex-name">Remo con barra inclinado</h1>
    <div class="tag" id="ex-tag">Tracción horizontal · espalda</div>
  </div>
  <div class="stage" id="stage"><div class="hint">🖐️ arrastra para girar</div></div>
  <div class="foot" id="ex-cue"></div>
</div>

<script src="../three.min.js"></script>
<script>
const EJ={
 nombre:'Remo con barra inclinado',
 tag:'Tracción horizontal · espalda',
 cue:'<b>Bisagra de cadera:</b> inclina el torso ~45° al frente, rodillas algo flexionadas y <b>espalda recta</b>, pies firmes en el piso. Deja colgar la barra con los brazos estirados y <b>jálala al abdomen llevando los codos arriba y atrás</b>, apretando la espalda. Baja controlado. Gíralo con el dedo para verlo desde cualquier ángulo.'
};
document.getElementById('ex-name').textContent=EJ.nombre;
document.getElementById('ex-tag').textContent=EJ.tag;
document.getElementById('ex-cue').innerHTML=EJ.cue;

const stage=document.getElementById('stage');
function boot(){
 if(!window.THREE){stage.innerHTML='<div class="err">No se pudo cargar el visor 3D. Ábrelo una vez con internet.</div>';return;}
 const w=stage.clientWidth,h=stage.clientHeight;
 const scene=new THREE.Scene();
 const cam=new THREE.PerspectiveCamera(42,w/h,0.1,50);
 cam.position.set(2.4,1.35,2.8);cam.lookAt(0,0.95,0.2);
 const rend=new THREE.WebGLRenderer({antialias:true,alpha:true});
 rend.setPixelRatio(Math.min(devicePixelRatio||1,2));rend.setSize(w,h);
 stage.appendChild(rend.domElement);
 scene.add(new THREE.HemisphereLight(0xbcd2ff,0x20242c,1.0));
 const dir=new THREE.DirectionalLight(0xffffff,0.9);dir.position.set(3,5,2);scene.add(dir);
 // piso
 const piso=new THREE.Mesh(new THREE.CircleGeometry(2,48),new THREE.MeshStandardMaterial({color:0x14171d,roughness:1}));
 piso.rotation.x=-Math.PI/2;scene.add(piso);

 const skin=0x6ea8ff,skin2=0x4f86e6,dark=0x2f3a4d;
 function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:.15});}
 function box(par,w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x||0,y||0,z||0);par.add(m);return m;}
 function piv(par,x,y,z){const g=new THREE.Group();g.position.set(x,y,z);par.add(g);return g;}
 function limbUp(par,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.y=h/2;par.add(m);return m;} // apunta +Y

 const orbit=new THREE.Group();scene.add(orbit);
 const fig=new THREE.Group();orbit.add(fig);

 // ===== Piernas de pie (rectas, pie plano en el piso) =====
 [-0.13,0.13].forEach(function(sx){
  const hip=piv(fig,sx,0.95,0);
  hip.rotation.x=Math.PI;                 // muslo recto hacia abajo
  limbUp(hip,0.15,0.42,0.15,skin2);
  const knee=piv(hip,0,0.42,0);
  knee.rotation.x=-0.12;                   // rodillas ligeramente flexionadas
  limbUp(knee,0.13,0.44,0.13,skin);
  box(fig,0.15,0.07,0.30,dark,sx,0.035,0.10); // pie plano en el suelo
 });

 // ===== Torso en bisagra de cadera (~45° al frente, +Z) =====
 const TAU=0.80; // inclinación del torso
 const torso=piv(fig,0,0.95,0); torso.rotation.x=TAU;
 box(torso,0.40,0.26,0.22,skin2,0,0.13,0);   // zona lumbar/abdomen
 box(torso,0.44,0.30,0.24,skin,0,0.42,0);    // espalda/pecho
 box(torso,0.11,0.10,0.11,skin2,0,0.62,0);   // cuello
 const head=new THREE.Mesh(new THREE.SphereGeometry(0.15,18,14),mat(skin));head.position.set(0,0.74,0.02);torso.add(head);

 // Hombros (colgados hacia el frente por la inclinación)
 const shL=piv(torso,-0.24,0.50,0);
 limbUp(shL,0.10,0.30,0.10,skin2);
 const elL=piv(shL,0,0.30,0);
 limbUp(elL,0.095,0.29,0.095,skin);
 box(elL,0.11,0.11,0.11,dark,0,0.29,0);       // mano
 const shR=piv(torso,0.24,0.50,0);
 limbUp(shR,0.10,0.30,0.10,skin2);
 const elR=piv(shR,0,0.30,0);
 limbUp(elR,0.095,0.29,0.095,skin);
 box(elR,0.11,0.11,0.11,dark,0,0.29,0);

 // Barra con discos, sigue a las manos
 const barbell=new THREE.Group();orbit.add(barbell);
 const barra=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,1.10,12),mat(0xcfd6e0));barra.rotation.z=Math.PI/2;barbell.add(barra);
 [-0.50,0.50].forEach(function(x){const pl=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.06,16),mat(0x2b3240));pl.rotation.z=Math.PI/2;pl.position.x=x;barbell.add(pl);});

 // Poses: A = brazos colgando estirados · B = barra al abdomen, codos arriba y atrás
 const A={s:2.34, e:0.10};
 const B={s:2.00, e:1.86};
 const upper=0.30, fore=0.29;
 // hombro en coordenadas del mundo (torso pivota en 0.95 e inclina TAU):
 const shWY=0.95+0.50*Math.cos(TAU), shWZ=0.50*Math.sin(TAU);
 function applyArms(p){
  shL.rotation.x=p.s; shR.rotation.x=p.s;
  elL.rotation.x=p.e; elR.rotation.x=p.e;
  // FK de la mano (ángulos del mundo suman TAU + s [+ e]):
  const au=TAU+p.s, af=TAU+p.s+p.e;
  const elbowY=shWY+upper*Math.cos(au), elbowZ=shWZ+upper*Math.sin(au);
  const handY=elbowY+fore*Math.cos(af), handZ=elbowZ+fore*Math.sin(af);
  barbell.position.set(0,handY,handZ);
 }

 orbit.rotation.y=-0.5;
 let drag=false,px=0,py=0;
 stage.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;stage.setPointerCapture(e.pointerId);});
 stage.addEventListener('pointermove',function(e){if(!drag)return;orbit.rotation.y+=(e.clientX-px)*0.01;orbit.rotation.x=Math.max(-1.0,Math.min(1.0,orbit.rotation.x+(e.clientY-py)*0.008));px=e.clientX;py=e.clientY;});
 stage.addEventListener('pointerup',function(){drag=false;});
 stage.addEventListener('pointercancel',function(){drag=false;});
 addEventListener('resize',function(){const w=stage.clientWidth,h=stage.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();rend.setSize(w,h);});

 const t0=performance.now();
 (function loop(){
  requestAnimationFrame(loop);
  const t=(Math.sin((performance.now()-t0)/700)+1)/2;
  const cur={};for(const k in A)cur[k]=A[k]+(B[k]-A[k])*t;
  applyArms(cur);
  rend.render(scene,cam);
 })();
}
boot();
</script>
</body>
</html>
